spring:
  application:
    name: psi-organizer

  datasource:
    url: jdbc:postgresql://localhost:5432/psi_organizer
    username: psi
    password: psi

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

psi:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-nao-use-em-producao-precisa-min-32-chars-123}
    expiracao-horas: 24
  cors:
    allowed-origins: http://localhost:5173
  whatsapp:
    # Padrão é true — usa MockWhatsappClient (loga, retorna id sintético).
    # Pra mandar mensagem real via Meta Cloud API, set false + as 3 envs abaixo.
    mock: ${WHATSAPP_MOCK:true}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v21.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    # Template HSM do lembrete — precisa estar aprovado na Meta (categoria UTILITY,
    # idioma pt_BR, 4 variáveis: {{1}}=paciente, {{2}}=psicologa, {{3}}=data, {{4}}=hora,
    # + 2 reply buttons Confirmar / Cancelar). Override por env se nome mudar.
    template-lembrete-nome: ${WHATSAPP_TEMPLATE_LEMBRETE_NOME:lembrete_consulta_v1}
    template-lembrete-idioma: ${WHATSAPP_TEMPLATE_LEMBRETE_IDIOMA:pt_BR}
    # Cron do scheduler em UTC. Default: hora cheia. Pra dev/teste, sobrescreva pra
    # algo tipo "0 */2 * * * *" (a cada 2 min) — exemplo em README.
    scheduler-cron: ${WHATSAPP_SCHEDULER_CRON:0 0 * * * *}
    # Secret do app Meta — usado pra validar HMAC-SHA256 do webhook. Quando em branco,
    # webhook rejeita todo POST com 401 (modo seguro pra dev local sem Meta real).
    app-secret: ${WHATSAPP_APP_SECRET:}
    # Token de verificação do handshake inicial do webhook. Inventado por nós.
    verify-token: ${WHATSAPP_VERIFY_TOKEN:dev-verify-token}
    # Quando true, ativa endpoints de simulação em /dev/whatsapp/* (POST simular-resposta).
    # Não usar em prod — não há autenticação no /dev/**.
    dev-tools: ${WHATSAPP_DEV_TOOLS:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
