spring:
  application:
    name: psi-organizer

  datasource:
    url: jdbc:postgresql://localhost:5432/psi_organizer
    username: psi
    password: psi

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

psi:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-nao-use-em-producao-precisa-min-32-chars-123}
    expiracao-horas: 24
  cors:
    allowed-origins: http://localhost:5173
  whatsapp:
    # Padrão é true — usa MockWhatsappClient (loga, retorna id sintético).
    # Pra mandar mensagem real via Meta Cloud API, set false + as 3 envs abaixo.
    mock: ${WHATSAPP_MOCK:true}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v21.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
