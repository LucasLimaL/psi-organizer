spring:
  application:
    name: psi-organizer

  datasource:
    url: jdbc:postgresql://localhost:5432/psi_organizer
    username: psi
    password: psi

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

psi:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-nao-use-em-producao-precisa-min-32-chars-123}
    expiracao-horas: 24
  cors:
    allowed-origins: http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
