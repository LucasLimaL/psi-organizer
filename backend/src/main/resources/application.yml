spring:
  application:
    name: psi-organizer

  datasource:
    # Em prod (Cloud Run), DB_URL usa o socket factory do Cloud SQL:
    # jdbc:postgresql:///psi_organizer?cloudSqlInstance=<proj:regiao:instancia>&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    url: ${DB_URL:jdbc:postgresql://localhost:5432/psi_organizer}
    username: ${DB_USER:psi}
    password: ${DB_PASSWORD:psi}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # Cloud Run injeta PORT; localmente cai no default 8080.
  port: ${PORT:8080}

psi:
  scheduler:
    # Token do gatilho HTTP POST /internal/whatsapp/tick (Cloud Scheduler).
    # Vazio = endpoint desabilitado (401 sempre). Em prod, setar via Secret Manager.
    tick-token: ${SCHEDULER_TICK_TOKEN:}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-nao-use-em-producao-precisa-min-32-chars-123}
    expiracao-horas: 24
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    # CSV de headers permitidos; default "*" (definido também como fallback no @Value)
    allowed-headers: "*"
  whatsapp:
    # Padrão é true — usa MockWhatsappClient (loga, retorna id sintético).
    # Pra mandar mensagem real via Meta Cloud API, set false + as 3 envs abaixo.
    mock: ${WHATSAPP_MOCK:true}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v21.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    # Template HSM do lembrete — precisa estar aprovado na Meta (categoria UTILITY,
    # idioma pt_BR, 4 variáveis: {{1}}=paciente, {{2}}=psicologa, {{3}}=data, {{4}}=hora,
    # + 2 reply buttons Confirmar / Cancelar). Override por env se nome mudar.
    template-lembrete-nome: ${WHATSAPP_TEMPLATE_LEMBRETE_NOME:lembrete_consulta_v1}
    template-lembrete-idioma: ${WHATSAPP_TEMPLATE_LEMBRETE_IDIOMA:pt_BR}
    # Cron do scheduler em UTC. Default: hora cheia. Pra dev/teste, sobrescreva pra
    # algo tipo "0 */2 * * * *" (a cada 2 min) — exemplo em README.
    # Em Cloud Run (scale-to-zero), use "-" (desliga o cron interno) e deixe o
    # Cloud Scheduler chamar POST /internal/whatsapp/tick de hora em hora.
    scheduler-cron: ${WHATSAPP_SCHEDULER_CRON:0 0 * * * *}
    # Secret do app Meta — usado pra validar HMAC-SHA256 do webhook. Quando em branco,
    # webhook rejeita todo POST com 401 (modo seguro pra dev local sem Meta real).
    app-secret: ${WHATSAPP_APP_SECRET:}
    # Token de verificação do handshake inicial do webhook. Inventado por nós.
    verify-token: ${WHATSAPP_VERIFY_TOKEN:dev-verify-token}
    # Quando true, ativa endpoints de simulação em /dev/whatsapp/* (POST simular-resposta).
    # Não usar em prod — não há autenticação no /dev/**.
    dev-tools: ${WHATSAPP_DEV_TOOLS:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Observabilidade — Actuator + Prometheus (PR D do spec WhatsApp).
# /actuator/health já era público (SecurityConfig).
# /actuator/prometheus expõe métricas Micrometer pra scraping; expomos
# também aqui pra deixar dashboards possíveis em dev sem auth, e em prod
# isso fica atrás de proxy/firewall típico de stack Prometheus.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
